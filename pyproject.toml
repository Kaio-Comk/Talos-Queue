[project]
name = "pgleasequeue"
version = "0.1.0"
description = "A durable job queue for Postgres / Supabase: leases, SKIP LOCKED, retries, dedupe"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pgleasequeue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
